// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.24'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ── Fix: duplicate kotlin-stdlib classes (jdk7/jdk8 merged into stdlib in Kotlin 1.8+) ──
// Forces all subprojects to resolve to a single consistent Kotlin stdlib version,
// preventing transitive dependencies from pulling in the old split artifacts alongside
// the new merged ones.
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion rootProject.ext.kotlin_version
                details.because 'Unify all kotlin-stdlib variants to eliminate duplicate class errors'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
