        <h1>Chain Gang Poker — Prison Rules. No Mercy.</h1>
        <p>
          Chain Gang Poker is a free multiplayer card-game platform featuring four unique poker variants
          you won't find anywhere else. No real money, no downloads — jump in from any browser and play
          against real opponents instantly. Earn virtual chips, climb the ranks from Bronze to Master,
          and complete daily quests to build your stack.
        </p>

        <h2>Game Modes</h2>

        <h3>Badugi</h3>
        <p>
          The original lowball draw game. Your goal is to make the best four-card hand using one card
          from each suit, with the lowest ranks winning. Players draw up to three times across three
          betting rounds. A four-card badugi (one of each suit, all different ranks) beats any three-card
          hand — strategy lies in when to stand pat, when to draw, and how to read your opponents.
        </p>

        <h3>Dead 7</h3>
        <p>
          A high-low split stud variant with a prison-yard twist. Seven cards are dealt; players declare
          High, Low, or Swing (both directions) before the showdown. The pot is split between the best
          high hand and the best qualifying low hand. Going Swing means you must win both halves outright
          or you lose everything — high risk, high reward.
        </p>

        <h3>15 / 35</h3>
        <p>
          A hit-or-bust card game where the winning target flips each round between 15 and 35. Players
          choose to hit or stand, racing to reach exactly the target total. Go over and you bust; come
          closest without busting and you take the pot. Simple to learn, brutal to master when the table
          is chasing the same number.
        </p>

        <h3>Suits &amp; Poker</h3>
        <p>
          A dual-path game where the same five community cards decide two simultaneous contests: a
          standard poker hand ranking and a suit-count contest. Players declare which path they're
          competing on before the reveal. The pot is split between the best poker hand and the player
          holding the highest number of matching suits — forcing hard decisions every round.
        </p>

        <h3>Flushed Up</h3>
        <p>
          Chase the flush. Players compete to build the longest suited run from a shared board of
          community cards. The player who completes the best flush wins the pot outright — no pairs,
          no straights, just the relentless pursuit of the same suit.
        </p>

        <h3>Kamikaze</h3>
        <p>
          A 3+2+1 split-pot game where players receive six cards dealt in three layers. Declare High
          or Low after all cards are visible. The player with the best High hand and the player with
          the best Low hand split the pot. Go Kamikaze and bet everything on sweeping both sides.
        </p>

        <h3>Bonecrusher</h3>
        <p>
          Six cards, full chaos. An extended stud variant with multiple street-betting rounds, a reveal
          phase, and a final High / Low / Swing declare. More cards and more betting rounds mean bigger
          pots and harder decisions — built for players who want a longer, deeper game.
        </p>

        <h3>Box Chevy</h3>
        <p>
          Ten cards — five in hand, five community — and a strict no-pairs rule. Any player holding a
          pair across their combined ten cards is automatically folded before the declare phase. Survivors
          declare High, Low, or Swing on a pure unique-rank hand. If you pair up, you're out.
        </p>

        <h3>Lady Luck</h3>
        <p>
          Pick your Queen and run the race. Each player chooses a Queen card as their champion at the
          start. As community cards are revealed one at a time, the first Queen to appear wins the pot
          for its backer. Side bets, spectator wagering, and real-time odds make every flip electric.
        </p>

        <h2>Features</h2>
        <ul>
          <li>Free to play — no real money, no credit card required</li>
          <li>No account needed — play instantly with a generated identity</li>
          <li>Real-time multiplayer with up to 8 players per table</li>
          <li>Private invite-only tables for friends</li>
          <li>Daily quests and milestone rewards</li>
          <li>Rank system: Bronze → Silver → Gold → Platinum → Diamond → Master</li>
          <li>Hourly chip bonuses to keep the game flowing</li>
          <li>Spectator mode with side-bet wagering (Lady Luck)</li>
          <li>Leaderboards, crew play, and a cosmetics store</li>
        </ul>

        <h2>How to Play</h2>

          No download, no sign-up, no waiting.
        </p>
