name: Upload iOS to App Store
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL to download the IPA from Codemagic artifacts'
        required: true

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA
        run: |
          curl -L \
            -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
            "${{ github.event.inputs.ipa_url }}" \
            -o App.ipa
          file App.ipa
          ls -la App.ipa

      - name: Check downloaded file
        run: |
          ls -la App.ipa
          file App.ipa
          head -c 100 App.ipa | xxd

      - name: Write API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_Q46H98VAD4.p8

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file App.ipa \
            --apiKey Q46H98VAD4 \
            --apiIssuer c6f2ea72-aabb-42c2-b0a6-93189e5b51a3
