name: Browser animation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: "false"

      - name: Run TypeScript check
        run: npm run check

      - name: Run Vitest suite
        run: npm test

      - name: Bootstrap development toolchain from public npm
        run: |
          DEV_DEPENDENCIES="$(node -e "const p=require('./package.json'); process.stdout.write(Object.entries(p.devDependencies).map(([name,version]) => name + '@' + version).join(' '))")"
          npm install --no-save --package-lock=false --ignore-scripts \
            --registry=https://registry.npmjs.org \
            $DEV_DEPENDENCIES
          test -x ./node_modules/.bin/playwright
          ./node_modules/.bin/playwright --version

      - name: Install Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser animation checks
        run: npm run test:browser

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-animation-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14