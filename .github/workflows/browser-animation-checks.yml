name: Browser animation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install managed Chromium
        run: npm run test:browser:install

      - name: Run browser animation checks
        run: npm run test:browser

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-animation-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14