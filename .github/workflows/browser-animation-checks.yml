name: Browser animation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        id: dependencies
        run: |
          # Replit's lockfile mirrors npm tarballs through private hosts that
          # GitHub runners cannot reach. Use the same public tarballs in CI;
          # npm ci still verifies every tarball against the lockfile integrity.
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          let replaced = 0;
          for (const entry of Object.values(lock.packages)) {
            if (!entry.resolved) continue;
            const url = new URL(entry.resolved);
            if (!['package-firewall.replit.local', 'package-firewall.replit.internal'].includes(url.hostname)) continue;
            if (!url.pathname.startsWith('/npm/')) throw new Error(`Unexpected registry path: ${url.pathname}`);
            entry.resolved = `https://registry.npmjs.org/${url.pathname.slice(5)}${url.search}`;
            replaced++;
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Using public npm tarballs for ${replaced} mirrored packages.`);
          NODE
          npm ci --include=dev --registry=https://registry.npmjs.org

          # npm has returned success after "Exit handler never called!" on CI.
          # Never fall through to a global/stale tsc when installation is incomplete.
          node <<'NODE'
          const fs = require('node:fs');
          const expected = require('./package.json').devDependencies.typescript;
          const locked = require('./package-lock.json').packages['node_modules/typescript'].version;
          const binary = './node_modules/.bin/tsc';
          let installed;
          try { installed = require('./node_modules/typescript/package.json').version; } catch {}
          if (expected !== locked || installed !== expected || !fs.existsSync(binary)) {
            console.error(`::error::npm ci incomplete: TypeScript expected=${expected}, locked=${locked}, installed=${installed ?? 'missing'}, local tsc=${fs.existsSync(binary) ? 'present' : 'missing'}`);
            process.exit(1);
          }
          console.log(`Verified local TypeScript ${installed} from package.json and package-lock.json.`);
          NODE
          test -x ./node_modules/.bin/playwright
          ./node_modules/.bin/tsc --version

      - name: Upload npm install diagnostics
        if: failure() && steps.dependencies.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-debug-logs
          path: ~/.npm/_logs/*-debug-0.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run TypeScript check
        run: npm run check

      - name: Run Vitest suite
        run: npm test

      - name: Install Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser animation checks
        run: npm run test:browser

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-animation-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14