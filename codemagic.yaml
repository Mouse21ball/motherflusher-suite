workflows:
  android-debug:
    name: Chain Gang Poker — Android Debug APK
    environment:
      java: 17
      node: 20
      vars:
        # ── REQUIRED: set this to your deployed Replit backend URL ──────────
        # Find it in Replit → Deployments tab (looks like https://yourapp.replit.app)
        # This URL is baked into the APK at build time so the app can reach
        # the multiplayer server from a real device.
        VITE_API_BASE_URL: https://chaing-gang-poker.replit.app
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Capacitor sync Android
        script: npx cap sync android

      - name: Make Gradle wrapper executable
        script: chmod +x android/gradlew

      - name: Assemble debug APK
        script: cd android && ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
