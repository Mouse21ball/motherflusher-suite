workflows:
  android-release:
    name: Chain Gang Poker — Android Release AAB
    environment:
      java: 17
      node: 20
      android_signing:
        - chaingang_keystore
      vars:
        VITE_API_BASE_URL: https://chainggangpoker.com
        VITE_SHARE_ORIGIN: https://chainggangpoker.com
    scripts:
      - name: Install npm dependencies
        script: |
          rm -f package-lock.json
          unset NPM_CONFIG_REGISTRY
          npm install --registry https://registry.npmjs.org/

      - name: Build web app
        script: npm run build

      - name: Capacitor sync Android
        script: npx cap sync android

      - name: Make Gradle wrapper executable
        script: chmod +x android/gradlew

      - name: Bundle release AAB
        script: cd android && ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab

  ios-release:
    name: iOS Release
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dgmentertainment.poker
      vars:
        BUNDLE_ID: com.dgmentertainment.poker
        VITE_API_BASE_URL: https://chainggangpoker.com
        VITE_SHARE_ORIGIN: https://chainggangpoker.com
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install npm dependencies
        script: |
          rm -f package-lock.json
          unset NPM_CONFIG_REGISTRY
          npm install --registry https://registry.npmjs.org/
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Build signed IPA for App Store
        script: |
          xcode-project use-profiles
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ios/App/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath ios/App/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath ios/App/output
      - name: Upload to App Store Connect
        script: |
          python3 << 'EOF'
          import base64
          import os

          key_b64 = os.environ.get('APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY', '')
          key_bytes = base64.b64decode(key_b64)
          key_path = '/Users/builder/.appstoreconnect/private_keys/AuthKey_Q46H98VAD4.p8'
          os.makedirs(os.path.dirname(key_path), exist_ok=True)
          with open(key_path, 'wb') as f:
              f.write(key_bytes)
          print("Key written successfully")
          with open(key_path, 'r') as f:
              print(f.read()[:50])
          EOF
          xcrun altool --upload-app \
            --type ios \
            --file /Users/builder/clone/ios/App/output/App.ipa \
            --apiKey Q46H98VAD4 \
            --apiIssuer c6f2ea72-aabb-42c2-b0a6-93189e5b51a3 \
            --verbose
    artifacts:
      - ios/App/output/*.ipa
