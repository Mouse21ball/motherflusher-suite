workflows:
  android-release:
    name: Chain Gang Poker — Android Release AAB
    environment:
      java: 17
      node: 20
      android_signing:
        - chaingang_keystore
      vars:
        VITE_API_BASE_URL: https://chainggangpoker.com
        VITE_SHARE_ORIGIN: https://chainggangpoker.com
    scripts:
      - name: Install npm dependencies
        script: |
          unset NPM_CONFIG_REGISTRY
          unset NODE_ENV
          npm cache clean --force
          npm install --registry https://registry.npmjs.org/ --legacy-peer-deps

      - name: Build web app
        script: |
          npm install -g tsx@4.20.5 --registry https://registry.npmjs.org/
          GIT_COMMIT_SHA="${CM_COMMIT:-$(git rev-parse HEAD)}" \
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          npm run build

      - name: Capacitor sync Android
        script: npx cap sync android

      - name: Make Gradle wrapper executable
        script: chmod +x android/gradlew

      - name: Bundle release AAB
        script: cd android && ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab

  ios-release:
    name: iOS Release
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dgmentertainment.poker
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        VITE_API_BASE_URL: https://chainggangpoker.com
        VITE_SHARE_ORIGIN: https://chainggangpoker.com
    scripts:
      - name: Install npm dependencies
        script: |
          unset NPM_CONFIG_REGISTRY
          unset NODE_ENV
          npm cache clean --force
          npm install --registry https://registry.npmjs.org/ --legacy-peer-deps
      - name: Build web app
        script: |
          npm install -g tsx@4.20.5 --registry https://registry.npmjs.org/
          GIT_COMMIT_SHA="${CM_COMMIT:-$(git rev-parse HEAD)}" \
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Build signed IPA
        script: |
          npm install -g tsx@4.20.5 --registry https://registry.npmjs.org/
          GIT_COMMIT_SHA="${CM_COMMIT:-$(git rev-parse HEAD)}"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          /usr/libexec/PlistBuddy -c "Set :CGPBuildCommit $GIT_COMMIT_SHA" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CGPBuildTimestamp $BUILD_TIMESTAMP" ios/App/App/Info.plist
          xcode-project use-profiles
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ios/App/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath ios/App/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath ios/App/output
    artifacts:
      - ios/App/output/*.ipa
